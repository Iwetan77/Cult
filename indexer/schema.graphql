"""
Verified per-address trading stats on Monad testnet, across two venues.

Every `Trader` is keyed by the lowercase wallet address. Perpl activity is joined
back to the wallet through `PerplAccount`; Nad.fun activity is address-native
(the router's Buy/Sell events carry the trader's wallet directly).

Units are kept separate and are never silently combined: Perpl PnL is AUSD
(`*CNS` = USD * 1e6), Nad.fun PnL is native MON (`*MonWei` = MON * 1e18). A
combined AUSD figure is only produced when a MON price is available per event;
the backend owns that conversion and serves the display value.
"""

enum Venue {
  PERPL
  NAD_FUN
}

enum TradeStatus {
  CLOSED
  LIQUIDATED
  DELEVERAGED
  UNWOUND
  INVERTED
}

"""
Maps a Perpl on-chain account id to the wallet that created it.
"""
type PerplAccount {
  id: BigInt!
  owner: String!
}

"""
Aggregate verified stats for one wallet, combined across venues.
"""
type Trader {
  id: String!
  "Number of fully-closed round-trip trades (both venues)."
  tradeCount: Int!
  "Closed trades with a positive realized PnL."
  winningTrades: Int!
  "Closed trades with a negative or zero realized PnL."
  losingTrades: Int!
  "winningTrades / tradeCount, 0..1. 0 when there are no closed trades."
  winRate: Float!
  "All-time realized Perpl PnL, raw AUSD CNS (USD * 1e6). Negative = net loss."
  realizedPnlCNS: BigInt!
  "All-time realized Perpl PnL in AUSD."
  realizedPnlUsd: BigDecimal!
  "All-time realized Nad.fun PnL, raw MON wei (MON * 1e18). Negative = net loss."
  realizedPnlMonWei: BigInt!
  "All-time realized Nad.fun PnL in MON."
  realizedPnlMon: BigDecimal!
  "Epoch ms of the first closed trade, if any."
  firstTradeAt: BigInt
  "Epoch ms of the last closed trade, if any."
  lastTradeAt: BigInt
  trades: [Trade!]! @derivedFrom(field: "trader")
  events: [PositionEvent!]! @derivedFrom(field: "trader")
  nadFunTrades: [NadFunTrade!]! @derivedFrom(field: "trader")
  nadFunEvents: [NadFunEvent!]! @derivedFrom(field: "trader")
  perplFills: [PerplFill!]! @derivedFrom(field: "trader")
}

"""
A single closed round-trip trade (a Perpl position opened then fully closed).
"""
type Trade {
  id: ID!
  venue: Venue!
  trader: Trader!
  "Perpl perpetual id."
  marketId: BigInt!
  symbol: String!
  side: String!
  status: TradeStatus!
  "Position size in base units (e.g. BTC)."
  size: BigDecimal!
  entryPrice: BigDecimal!
  exitPrice: BigDecimal!
  "entryPrice * size, in USD."
  notionalUsd: BigDecimal!
  "Realized PnL for this round trip, raw CNS (USD * 1e6)."
  realizedPnlCNS: BigInt!
  "Realized PnL for this round trip, in USD."
  realizedPnlUsd: BigDecimal!
  isWin: Boolean!
  openedAt: BigInt!
  closedAt: BigInt!
  openTx: String!
  closeTx: String!
  openBlock: BigInt!
  closeBlock: BigInt!
}

"""
One position lifecycle event. This is the raw, timestamped history the
summaries are built from — every open, increase, decrease, close, liquidation,
deleverage, inversion and unwind.
"""
type PositionEvent {
  id: ID!
  venue: Venue!
  trader: Trader!
  marketId: BigInt!
  symbol: String!
  side: String!
  "OPENED | INCREASED | DECREASED | CLOSED | LIQUIDATED | DELEVERAGED | INVERTED | UNWOUND"
  kind: String!
  "Fill/exit price for this event (human)."
  price: BigDecimal!
  "Signed size change (positive = adds size, negative = removes size)."
  sizeDelta: BigDecimal!
  "Realized delta (price) PnL of this event, raw CNS."
  deltaPnlCNS: BigInt!
  "Realized funding PnL of this event, raw CNS."
  fundingCNS: BigInt!
  "deltaPnlCNS + fundingCNS, raw CNS."
  realizedPnlCNS: BigInt!
  timestamp: BigInt!
  tx: String!
  block: BigInt!
  logIndex: Int!
}

"""
Internal position state used to reconstruct round trips. Not exposed.
"""
type PerplPosition @internal {
  id: ID!
  perpId: BigInt!
  accountId: BigInt!
  owner: String!
  side: String!
  "Current open size in raw lots."
  sizeLNS: BigInt!
  "Cumulative realized PnL (CNS) since this position last opened."
  realizedPnlCNS: BigInt!
  entryPricePNS: BigInt!
  openedAt: BigInt!
  openTx: String!
  openBlock: BigInt!
  status: String!
}

"""
A single closed Nad.fun round trip (buy a token back to zero). Realized PnL is
in native MON. `qtyRaw` is in the token's own decimals; MON fields are scaled
by 1e18.
"""
type NadFunTrade {
  id: ID!
  venue: Venue!
  trader: Trader!
  token: String!
  "null = the member's own trade; 'mirror' | 'stack' once openTx is joined against backend /v1/indexer/txs (any mirror_* kind = 'mirror', stack_* = 'stack')."
  origin: String
  "Total token quantity of the round trip, raw token units."
  qtyRaw: BigInt!
  "Total MON spent across all buys, MON."
  costMon: BigDecimal!
  "Total MON received across all sells, MON."
  proceedsMon: BigDecimal!
  "proceeds - cost, in MON."
  realizedPnlMon: BigDecimal!
  "proceeds - cost, raw MON wei."
  realizedPnlMonWei: BigInt!
  isWin: Boolean!
  buyCount: Int!
  sellCount: Int!
  openedAt: BigInt!
  closedAt: BigInt!
  openTx: String!
  closeTx: String!
  openBlock: BigInt!
  closeBlock: BigInt!
}

"""
One Nad.fun router Buy/Sell event. The raw, timestamped list behind `NadFunTrade`.
`amountIn`/`amountOut` semantics depend on `kind`: for BUY amountIn is MON wei
spent and amountOut is tokens; for SELL amountIn is tokens and amountOut is MON
wei received.
"""
type NadFunEvent {
  id: ID!
  trader: Trader!
  token: String!
  kind: String!
  amountInRaw: BigInt!
  amountOutRaw: BigInt!
  graduated: Boolean!
  timestamp: BigInt!
  tx: String!
  block: BigInt!
  logIndex: Int!
}

"""
Internal Nad.fun cost basis per (wallet, token). Average cost in MON wei.
"""
type NadFunPosition @internal {
  id: ID!
  wallet: String!
  token: String!
  "Current token balance, raw token units."
  qtyRaw: BigInt!
  "Average-cost basis of the remaining balance, raw MON wei."
  costMonWei: BigInt!
  "Cumulative realized PnL since the balance last hit zero, raw MON wei."
  realizedMonWei: BigInt!
  "Largest balance reached this round trip, raw token units."
  peakQtyRaw: BigInt!
  "Total MON wei spent across all buys this round trip."
  totalCostMonWei: BigInt!
  "Total MON wei received across all sells this round trip."
  totalProceedsMonWei: BigInt!
  openedAt: BigInt!
  openTx: String!
  openBlock: BigInt!
  buyCount: Int!
  sellCount: Int!
  status: String!
}

"""
One Perpl resting-order (maker) fill on a member's account: price, size, fee.
Taker fills carry no account id on-chain, so they only show through the
position events they cause.
"""
type PerplFill {
  id: ID!
  trader: Trader!
  accountId: BigInt!
  marketId: BigInt!
  symbol: String!
  orderId: BigInt!
  price: BigDecimal!
  size: BigDecimal!
  "Fee charged on this fill, USD."
  feeUsd: BigDecimal!
  "ms"
  timestamp: BigInt!
  tx: String!
  block: BigInt!
  logIndex: Int!
}
